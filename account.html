<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account | Sree Veerabhadra Pickles</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .account-page {
      min-height: 80vh;
      padding: 50px 20px;
      background: #fff8eb;
    }

    .account-container {
      max-width: 950px;
      margin: auto;
    }

    .account-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .account-card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      margin-bottom: 25px;
    }

    .account-card h2 {
      color: #0d5c35;
      margin-top: 0;
    }

    .profile-row {
      margin: 10px 0;
      word-break: break-word;
    }

    .order-card {
      border: 1px solid #e5dccb;
      border-radius: 12px;
      padding: 18px;
      margin-top: 15px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .order-status {
      background: #e6f4ea;
      color: #0d5c35;
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: bold;
    }

    .order-items {
      margin: 12px 0;
      padding-left: 20px;
    }

    .account-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .empty-message {
      text-align: center;
      padding: 25px;
      color: #666;
    }

    .order-feedback {
      margin: 18px 0;
      padding: 18px;
      border: 1px solid #e8c98e;
      border-radius: 14px;
      background: linear-gradient(145deg, #fffaf0, #fff1cf);
    }

    .order-feedback h3 { margin: 0 0 5px; color: #8f2918; }
    .order-feedback label { display: block; margin: 12px 0; font-weight: 700; }
    .order-feedback select, .order-feedback textarea { width: 100%; margin-top: 6px; padding: 11px; border: 1px solid #dcc5a4; border-radius: 9px; background: white; font: inherit; }
    .feedback-submitted { padding: 14px; border-radius: 10px; background: #e5f5e8; color: #14622f; font-weight: 800; text-align: center; }
    #feedbackThanks { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; padding: 20px; background: rgba(40, 24, 17, .72); backdrop-filter: blur(7px); }
    .feedback-thanks-card { width: min(100%, 470px); padding: 30px 24px; border-radius: 26px; border: 2px solid #efcd87; background: linear-gradient(150deg, #fffdf8, #ffedc8); text-align: center; box-shadow: 0 24px 70px rgba(50, 20, 10, .35); }
    .feedback-thanks-card img { width: 82px; height: 82px; object-fit: contain; border-radius: 50%; }
    .feedback-heart { color: #a52c1b; font-size: 48px; line-height: 1; }
    .feedback-thanks-card h2 { color: #7f2417; font-family: Georgia, serif; font-size: 30px; margin: 8px 0; }
    .feedback-thanks-card p { color: #665048; line-height: 1.6; margin-bottom: 20px; }

    @media (max-width: 600px) {
      .account-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="container nav">
    <a class="brand" href="index.html">
      <img src="logo.jpeg" alt="Sree Veerabhadra Pickles logo">
      <div>
        <strong>Sree Veerabhadra</strong>
        <span>Pickles</span>
      </div>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <button id="logoutBtn" type="button">Logout</button>
    </nav>
  </div>
</header>

<main class="account-page">
  <div class="account-container">

    <div class="account-header">
      <div>
        <span class="tag">Customer account</span>
        <h1>My Account</h1>
      </div>

      <a href="index.html#products" class="btn primary">
        Shop Pickles
      </a>
    </div>

    <section class="account-card">
      <h2>Profile</h2>

      <div class="profile-row">
        <strong>Name:</strong>
        <span id="customerName">Loading…</span>
      </div>

      <div class="profile-row">
        <strong>Email:</strong>
        <span id="customerEmail">Loading…</span>
      </div>

      <div class="profile-row">
        <strong>Phone:</strong>
        <span id="customerPhone">Not available</span>
      </div>
      <div class="profile-row">
        <label for="accountPhone"><strong>Link orders using phone:</strong></label>
        <input id="accountPhone" type="tel" maxlength="10" placeholder="10-digit phone number">
        <button id="savePhoneBtn" class="btn primary" type="button">Save & Show My Orders</button>
      </div>
    </section>

    <section class="account-card">
      <h2>My Orders</h2>

      <div id="ordersLoading" class="notice">
        Loading your orders…
      </div>

      <div id="ordersList"></div>
    </section>

  </div>
</main>

<footer>
  <div class="container footer">
    <span>© Sree Veerabhadra Pickles</span>
    <a href="index.html">Back to Home</a>
  </div>
</footer>

<script type="module" src="account.js?v=6"></script>
</body>
</html>
